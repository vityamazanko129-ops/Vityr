<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>.</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const c = document.getElementById('c');
  const x = c.getContext('2d');
  let W, H;

  function resize() {
    W = c.width  = innerWidth  * (devicePixelRatio || 1);
    H = c.height = innerHeight * (devicePixelRatio || 1);
  }
  addEventListener('resize', resize);
  resize();

  // частицы — 4000 штук, тяжёлая физика + трейлы
  const N = 4000;
  const px = new Float32Array(N);
  const py = new Float32Array(N);
  const vx = new Float32Array(N);
  const vy = new Float32Array(N);
  const hue = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    px[i] = Math.random() * W;
    py[i] = Math.random() * H;
    vx[i] = (Math.random() - 0.5) * 2;
    vy[i] = (Math.random() - 0.5) * 2;
    hue[i] = Math.random() * 360;
  }

  let t = 0;

  function loop() {
    requestAnimationFrame(loop);
    t += 0.01;

    // лёгкий трейл вместо полной очистки
    x.fillStyle = 'rgba(0,0,0,0.08)';
    x.fillRect(0, 0, W, H);

    x.globalCompositeOperation = 'lighter';

    for (let i = 0; i < N; i++) {
      // притяжение к центру + swirl
      const cx = W / 2, cy = H / 2;
      const dx = cx - px[i], dy = cy - py[i];
      const d2 = dx * dx + dy * dy + 100;
      const f = 800 / d2;
      vx[i] += dx * f * 0.01 + Math.sin(t + py[i] * 0.01) * 0.3;
      vy[i] += dy * f * 0.01 + Math.cos(t + px[i] * 0.01) * 0.3;

      // трение
      vx[i] *= 0.98;
      vy[i] *= 0.98;

      // границы — мягкий отскок
      if (px[i] < 0 || px[i] > W) vx[i] *= -1;
      if (py[i] < 0 || py[i] > H) vy[i] *= -1;

      px[i] += vx[i];
      py[i] += vy[i];

      // рисуем
      const spd = Math.min(1, Math.hypot(vx[i], vy[i]) * 0.3);
      x.fillStyle = `hsla(${(hue[i] + t * 30) % 360}, 90%, ${50 + spd * 30}%, 0.85)`;
      x.fillRect(px[i], py[i], 2.5, 2.5);
    }

    x.globalCompositeOperation = 'source-over';

    // пост-фильтр: вторая волна поверх — вдвое больше работы
    for (let i = 0; i < N; i += 2) {
      x.beginPath();
      x.arc(px[i], py[i], Math.random() * 4, 0, 6.283);
      x.fillStyle = `hsla(${(hue[i] + 180) % 360}, 100%, 60%, 0.4)`;
      x.fill();
    }

    // scanlines поверх — лишний пиксельный проход
    x.fillStyle = 'rgba(0,0,0,0.08)';
    for (let y = 0; y < H; y += 4) x.fillRect(0, y, W, 1);
  }

  loop();
})();
</script>
</body>
</html>
