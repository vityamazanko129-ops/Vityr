<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>.</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:8px;bottom:8px;color:#0f0;font:11px monospace;opacity:.6;pointer-events:none}
  #nogl{position:fixed;inset:0;display:grid;place-items:center;color:#f44;font:14px monospace}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">warming…</div>
<div id="nogl" style="display:none">no webgl2</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const hud = document.getElementById('hud');
  const gl = canvas.getContext('webgl2', {
    antialias: false,
    alpha: false,
    depth: false,
    stencil: false,
    powerPreference: 'high-performance',
    desynchronized: true
  });
  if (!gl) { document.getElementById('nogl').style.display = 'grid'; return; }

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const MAX_DPR = isMobile ? 3 : 4;
  const DPR = Math.min(devicePixelRatio || 1, MAX_DPR);
  let W = 0, H = 0;

  // три fullscreen-RT + feedback-RT
  function mkTex(w, h, internal, format, type) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;
  }
  function mkFBO(w, h, nAttach, float) {
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    const texs = [];
    const bufs = [];
    for (let i = 0; i < nAttach; i++) {
      const t = mkTex(w, h, float ? gl.RGBA16F : gl.RGBA8, gl.RGBA, float ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0);
      texs.push(t);
      bufs.push(gl.COLOR_ATTACHMENT0 + i);
    }
    gl.drawBuffers(bufs);
    return { fbo, texs, w, h };
  }

  let rtA, rtB, fbRT;
  function alloc() {
    W = canvas.width  = Math.floor(innerWidth  * DPR);
    H = canvas.height = Math.floor(innerHeight * DPR);
    // G-buffer: 4 MRT
    rtA = mkFBO(W, H, 4, true);
    rtB = mkFBO(W, H, 4, true);
    fbRT = mkFBO(W, H, 1, true);
    gl.viewport(0, 0, W, H);
  }
  addEventListener('resize', alloc);
  alloc();

  // fullscreen triangle
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function sh(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function prog(vs, fs, outs) {
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    if (outs) outs.forEach((o, i) => gl.bindFragDataLocation(p, i, o));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw new Error(gl.getProgramInfoLog(p));
    gl.bindAttribLocation(p, 0, 'p');
    return p;
  }

  // ---- PASS 1: тяжёлый G-buffer (4 MRT, fbm-стек, 8 октав на канал) ----
  const VS = `#version 300 es
  in vec2 p; out vec2 uv;
  void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

  const GS = `#version 300 es
  precision highp float;
  in vec2 uv;
  uniform float t;
  uniform vec2 res;

  layout(location=0) out vec4 oCol;
  layout(location=1) out vec4 oNormal;
  layout(location=2) out vec4 oMisc;
  layout(location=3) out vec4 oEmit;

  float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
  float vnoise(vec2 p){
    vec2 i=floor(p), f=fract(p);
    vec2 u=f*f*(3.-2.*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),
               mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
  }
  float fbm(vec2 p, int oct){
    float v=0., a=.5;
    for(int i=0;i<12;i++){
      if(i>=oct) break;
      v += a*vnoise(p); p = mat2(1.6,1.2,-1.2,1.6)*p; a*=.5;
    }
    return v;
  }

  void main(){
    vec2 p = uv*2.-1.;
    p.x *= res.x/res.y;

    vec2 q = vec2(fbm(p + t*0.12, 10), fbm(p + vec2(5.2,1.3) - t*0.09, 10));
    vec2 r = vec2(fbm(p + 4.0*q + vec2(1.7,9.2) + t*0.21, 11),
                  fbm(p + 4.0*q + vec2(8.3,2.8) - t*0.17, 11));
    float f = fbm(p + 4.0*r, 12);

    vec3 col = mix(vec3(0.02,0.0,0.08), vec3(0.95,0.08,0.72), clamp(f*f*2.2,0.,1.));
    col = mix(col, vec3(1.0,0.86,0.18), clamp(length(r)*0.7,0.,1.));
    col *= 0.8 + 0.4*sin(t*2.3 + f*20.0);

    float dx = fbm(p + vec2(0.01,0.0), 6) - f;
    float dy = fbm(p + vec2(0.0,0.01), 6) - f;
    vec3 n = normalize(vec3(dx, dy, 0.5));

    oCol    = vec4(col, 1.0);
    oNormal = vec4(n*0.5+0.5, 1.0);
    oMisc   = vec4(f, length(r), length(q), 1.0);
    oEmit   = vec4(col * (0.4 + 0.8*f), 1.0);
  }`;

  // ---- PASS 2: bright-pass ----
  const BRIGHT = `#version 300 es
  precision highp float;
  in vec2 uv; out vec4 o;
  uniform sampler2D src;
  void main(){
    vec3 c = texture(src, uv).rgb;
    float l = dot(c, vec3(0.299,0.587,0.114));
    o = vec4(c * smoothstep(0.6, 1.0, l), 1.0);
  }`;

  // ---- PASS 3: 9-tap gaussian blur ----
  const BLUR = `#version 300 es
  precision highp float;
  in vec2 uv; out vec4 o;
  uniform sampler2D src;
  uniform vec2 dir;
  void main(){
    vec2 d = dir / vec2(textureSize(src, 0));
    vec3 s = texture(src, uv).rgb * 0.2270270270;
    s += texture(src, uv + d*1.0).rgb * 0.1945945946;
    s += texture(src, uv - d*1.0).rgb * 0.1945945946;
    s += texture(src, uv + d*2.0).rgb * 0.1216216216;
    s += texture(src, uv - d*2.0).rgb * 0.1216216216;
    s += texture(src, uv + d*3.0).rgb * 0.0540540541;
    s += texture(src, uv - d*3.0).rgb * 0.0540540541;
    s += texture(src, uv + d*4.0).rgb * 0.0162162162;
    s += texture(src, uv - d*4.0).rgb * 0.0162162162;
    o = vec4(s, 1.0);
  }`;

  // ---- PASS 4: feedback-буфер (старый кадр подмешивается) ----
  const FEED = `#version 300 es
  precision highp float;
  in vec2 uv; out vec4 o;
  uniform sampler2D scene;
  uniform sampler2D prev;
  uniform float t;
  void main(){
    vec2 off = vec2(sin(t*0.7), cos(t*0.6)) * 0.004;
    vec3 s = texture(scene, uv).rgb;
    vec3 p = texture(prev, uv + off).rgb;
    o = vec4(max(s*0.92, p*0.86) + s*0.08, 1.0);
  }`;

  // ---- PASS 5: composite + bloom + vignette + scanlines ----
  const COMP = `#version 300 es
  precision highp float;
  in vec2 uv; out vec4 o;
  uniform sampler2D scene;
  uniform sampler2D bloom;
  uniform sampler2D normal;
  uniform sampler2D feedback;
  uniform vec2 res;
  uniform float t;

  void main(){
    vec3 c = texture(scene, uv).rgb;
    vec3 b = texture(bloom, uv).rgb;
    vec3 fb = texture(feedback, uv).rgb;
    vec3 n = texture(normal, uv).xyz * 2.0 - 1.0;

    // normal-based specular sheen
    float spec = pow(max(dot(normalize(n), vec3(0.,0.,1.)), 0.0), 24.0);
    c += spec * vec3(0.4,0.6,1.0) * 0.6;

    c = c*0.7 + b*1.2 + fb*0.35;
    c *= 1.0 - 0.55*dot(uv-0.5, uv-0.5);

    // film grain
    float g = fract(sin(dot(uv*res + t, vec2(12.9898,78.233)))*43758.5453);
    c += (g - 0.5) * 0.04;

    // scanlines
    c *= 0.85 + 0.15*step(0.5, fract(uv.y*res.y*0.5));

    c = pow(clamp(c, 0.0, 1.0), vec3(0.9));
    o = vec4(c, 1.0);
  }`;

  let pGS, pBright, pBlur, pFeed, pComp;
  try {
    pGS     = prog(VS, GS);
    pBright = prog(VS, BRIGHT);
    pBlur   = prog(VS, BLUR);
    pFeed   = prog(VS, FEED);
    pComp   = prog(VS, COMP);
  } catch (e) {
    hud.textContent = 'shader err';
    console.error(e);
    return;
  }

  const loc = (p, n) => gl.getUniformLocation(p, n);
  const uGS_t = loc(pGS, 't'), uGS_res = loc(pGS, 'res');
  const uBright_src = loc(pBright, 'src');
  const uBlur_src = loc(pBlur, 'src'), uBlur_dir = loc(pBlur, 'dir');
  const uFeed_scene = loc(pFeed, 'scene'), uFeed_prev = loc(pFeed, 'prev'), uFeed_t = loc(pFeed, 't');
  const uComp_scene = loc(pComp, 'scene'), uComp_bloom = loc(pComp, 'bloom'),
        uComp_normal = loc(pComp, 'normal'), uComp_feedback = loc(pComp, 'feedback'),
        uComp_res = loc(pComp, 'res'), uComp_t = loc(pComp, 't');

  let t0 = performance.now();
  let frames = 0, fpsTime = t0, raf = null;
  let visible = true;
  document.addEventListener('visibilitychange', () => {
    visible = !document.hidden;
    if (visible) fpsTime = performance.now();
  });

  function bindTex(unit, tex) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
  }

  function loop(now) {
    raf = requestAnimationFrame(loop);
    if (!visible) return;
    const t = (now - t0) / 1000;
    gl.bindVertexArray(vao);
    gl.viewport(0, 0, W, H);

    // PASS 1 → rtA (4 MRT)
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtA.fbo);
    gl.useProgram(pGS);
    gl.uniform1f(uGS_t, t);
    gl.uniform2f(uGS_res, W, H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // PASS 2: bright-pass rtA.tex0 → fbRT
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbRT.fbo);
    gl.useProgram(pBright);
    bindTex(0, rtA.texs[0]);
    gl.uniform1i(uBright_src, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // PASS 3: blur fbRT → rtB (два прохода)
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtB.fbo);
    gl.useProgram(pBlur);
    bindTex(0, fbRT.texs[0]);
    gl.uniform1i(uBlur_src, 0);
    gl.uniform2f(uBlur_dir, 1.0, 0.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, fbRT.fbo);
    bindTex(0, rtB.texs[0]);
    gl.uniform1i(uBlur_src, 0);
    gl.uniform2f(uBlur_dir, 0.0, 1.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // PASS 4: feedback: rtA.tex0 + prev(fbRT) → rtB.tex0
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtB.fbo);
    gl.useProgram(pFeed);
    bindTex(0, rtA.texs[0]);
    bindTex(1, fbRT.texs[0]);
    gl.uniform1i(uFeed_scene, 0);
    gl.uniform1i(uFeed_prev, 1);
    gl.uniform1f(uFeed_t, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // PASS 5: composite → экран
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.useProgram(pComp);
    bindTex(0, rtA.texs[0]);
    bindTex(1, rtB.texs[0]);
    bindTex(2, rtA.texs[1]);
    bindTex(3, rtB.texs[0]);
    gl.uniform1i(uComp_scene, 0);
    gl.uniform1i(uComp_bloom, 1);
    gl.uniform1i(uComp_normal, 2);
    gl.uniform1i(uComp_feedback, 3);
    gl.uniform2f(uComp_res, W, H);
    gl.uniform1f(uComp_t, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    frames++;
    if (now - fpsTime > 500) {
      hud.textContent = (frames * 1000 / (now - fpsTime)).toFixed(0) + ' fps';
      frames = 0; fpsTime = now;
    }
  }
  loop(performance.now());

  addEventListener('pageshow', () => { if (!raf) loop(performance.now()); });
})();
</script>
</body>
</html>
