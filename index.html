<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>.</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #s{position:fixed;left:8px;bottom:8px;color:#0f0;font:12px monospace}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="s">…</div>
<script>
(() => {
  const c = document.getElementById('c');
  const x = c.getContext('2d');
  const s = document.getElementById('s');
  let W, H;

  function resize() {
    W = c.width  = innerWidth  * (devicePixelRatio || 1);
    H = c.height = innerHeight * (devicePixelRatio || 1);
  }
  addEventListener('resize', resize);
  resize();

  // тяжёлая математика — вот это реально жрёт CPU
  function heavy(n) {
    let acc = 0;
    for (let i = 0; i < n; i++) {
      const a = Math.sin(i * 0.001) * Math.cos(i * 0.0023);
      const b = Math.sqrt(Math.abs(a) + 1) * Math.tan(i * 0.0007);
      acc += b * Math.exp(-Math.abs(a) * 0.5);
      acc = acc % 1e9;
    }
    return acc;
  }

  let t = 0;
  let fps = 60, last = performance.now(), frames = 0, ft = last;

  function loop(now) {
    requestAnimationFrame(loop);
    t += 0.01;

    // CPU-бомба: 3 миллиона итераций КАЖДЫЙ кадр
    const acc = heavy(3000000);

    // трейл
    x.fillStyle = 'rgba(0,0,0,0.12)';
    x.fillRect(0, 0, W, H);

    // рисуем что-то визуально заметное
    x.globalCompositeOperation = 'lighter';
    const cx = W / 2 + Math.sin(t) * W * 0.3;
    const cy = H / 2 + Math.cos(t * 1.3) * H * 0.3;
    const r = 60 + Math.abs(acc % 100) * 2;

    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, `hsla(${(t * 50) % 360}, 100%, 70%, 1)`);
    g.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
    x.fillStyle = g;
    x.beginPath();
    x.arc(cx, cy, r, 0, 6.283);
    x.fill();
    x.globalCompositeOperation = 'source-over';

    // fps
    frames++;
    if (now - ft > 500) {
      fps = frames * 1000 / (now - ft);
      frames = 0; ft = now;
      s.textContent = fps.toFixed(0) + ' fps';
    }
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
